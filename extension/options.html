<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Flow Live Comments Bridge — Settings</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: #0b0d10;
        color: #e6e8eb;
        margin: 0;
        padding: 32px;
      }
      .wrap {
        max-width: 520px;
        margin: 0 auto;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 6px;
      }
      p.help {
        color: #8a93a0;
        font-size: 13px;
        margin: 0 0 24px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #8a93a0;
        margin: 16px 0 6px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        background: #161a1f;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        color: #e6e8eb;
        padding: 10px 12px;
        font: inherit;
        font-size: 14px;
        box-sizing: border-box;
      }
      input:focus {
        outline: none;
        border-color: #4f8cff;
      }
      button.primary {
        background: #4f8cff;
        color: white;
        border: 0;
        padding: 10px 16px;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        margin-top: 24px;
      }
      .status {
        margin-top: 16px;
        font-size: 13px;
      }
      .ok {
        color: #2ecc71;
      }
      .bad {
        color: #ef5350;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Flow Live Comments Bridge</h1>
      <p class="help">
        Reads YouTube and Facebook live chat from your browser tabs and
        forwards each comment to the aggregator server, bypassing FB's
        anonymized live-API and YouTube's data-center IP throttling.
      </p>

      <label for="server">Server URL</label>
      <input
        id="server"
        type="text"
        placeholder="https://live-comments-flow.fly.dev"
      />

      <label for="token">Admin token</label>
      <input id="token" type="password" placeholder="FL0W (or your custom token)" />

      <button class="primary" id="save">Save &amp; test</button>
      <div class="status" id="status"></div>
    </div>
    <script src="options.js"></script>
  </body>
</html>
