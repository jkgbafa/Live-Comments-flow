<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: #0b0d10;
        color: #e6e8eb;
        margin: 0;
        padding: 16px;
        width: 280px;
        font-size: 13px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 600;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .row:last-child {
        border-bottom: 0;
      }
      .label {
        color: #8a93a0;
        font-size: 12px;
      }
      .val {
        font-weight: 500;
        word-break: break-all;
        text-align: right;
        max-width: 60%;
      }
      .ok {
        color: #2ecc71;
      }
      .bad {
        color: #ef5350;
      }
      .muted {
        color: #8a93a0;
      }
      button {
        background: #4f8cff;
        color: white;
        border: 0;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        margin-top: 12px;
        width: 100%;
      }
      button:hover {
        filter: brightness(1.1);
      }
      a {
        color: #4f8cff;
        text-decoration: none;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Flow Live Comments Bridge</h1>
    <div class="row">
      <span class="label">Server</span>
      <span class="val" id="server">…</span>
    </div>
    <div class="row">
      <span class="label">Token</span>
      <span class="val" id="token">…</span>
    </div>
    <div class="row">
      <span class="label">Connection</span>
      <span class="val" id="conn">checking…</span>
    </div>
    <div class="row">
      <span class="label">Pending queue</span>
      <span class="val" id="pending">0</span>
    </div>
    <button id="settings">Open settings</button>
    <p style="margin: 12px 0 0; text-align: center">
      <a href="#" id="open-viewer">Open public viewer ↗</a>
    </p>
    <script src="popup.js"></script>
  </body>
</html>
